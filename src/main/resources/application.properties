spring.application.name=HRmanagementSystems-1

spring.datasource.url=jdbc:mysql://localhost:3306/hr_management?useSSL=false
spring.datasource.username=root
spring.datasource.password=Tiger@1005
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql: true


# HikariCP connection pool configuration
spring.datasource.hikari.pool-name=HRManagementPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


logging.level.root=INFO
logging.level.com.example=DEBUG
logging.file.name=application.log

management.endpoints.web.exposure.include=* 
management.endpoint.health.show-details=always

spring.security.user.name=admin
spring.security.user.password=admin@123
 

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
